<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d8f78">
  <title>RUMA — Perbaiki Cache</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f8f7;color:#16201e;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:520px;background:#fff;border:1px solid #dfe8e5;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.08)}h1{margin:0 0 12px}p{line-height:1.6}.ok{color:#087f69;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Memperbaiki cache RUMA…</h1>
    <p id="status">Menghapus Service Worker dan cache aplikasi lama. Data konfigurasi lokal dan session tidak dihapus.</p>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('ruma-')).map(k=>caches.delete(k)));
        }
        status.innerHTML='<span class="ok">Cache lama berhasil dibersihkan.</span><br>RUMA akan dimuat ulang dengan file terbaru.';
        setTimeout(()=>location.replace('./?cache_reset='+Date.now()),900);
      }catch(err){
        status.textContent='Gagal membersihkan cache: '+(err?.message||err);
      }
    })();
  </script>
</body>
</html>
